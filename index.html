<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOS - AI Family Healthcare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; } </style>
</head>
<body class="flex justify-center items-center min-h-screen p-4">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">CareOS</h1>
                <p class="text-sm text-slate-500">Good Morning, Rahul</p>
            </div>
            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">R</div>
        </div>
        <div class="mb-6">
            <h2 class="text-sm font-semibold text-slate-700 mb-3">Your Family</h2>
            <div class="flex gap-4">
                <div class="flex flex-col items-center"><div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center border-2 border-blue-500 text-xl">👨</div><span class="text-xs font-medium mt-1">Dad</span></div>
                <div class="flex flex-col items-center"><div class="w-12 h-12 bg-pink-50 rounded-full flex items-center justify-center text-xl">👩</div><span class="text-xs font-medium mt-1">Mom</span></div>
            </div>
        </div>
        <div class="bg-slate-50 rounded-xl p-4 mb-6 border border-slate-100">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-700">Dad's Blood Test</h2>
                <span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full font-medium">2 Abnormal</span>
            </div>
            <div class="flex bg-white rounded-lg p-1 mb-4 text-xs font-medium shadow-sm">
                <button class="flex-1 py-1.5 text-slate-500">English</button>
                <button class="flex-1 py-1.5 bg-blue-600 text-white rounded-md">தமிழ்</button>
            </div>
            <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-2">
                <span class="text-sm text-slate-600">Cholesterol</span>
                <span class="text-sm font-bold text-red-500">240 mg/dL (High)</span>
            </div>
            <div class="bg-blue-50 rounded-lg p-3 mt-3">
                <p class="text-xs font-semibold text-blue-800 mb-1">Ask your Doctor:</p>
                <p class="text-sm text-blue-900">இந்த கொழுப்பு மாத்திரையை மாற்ற வேண்டுமா?</p>
            </div>
        </div>
    </div>
</body>
</html>
